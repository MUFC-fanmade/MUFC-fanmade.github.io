<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MUFC Chart Contest</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="styles.css" />
    <script src="config.js?v=20260530-chartpack"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#home" aria-label="MUFC Chart Contest home">
        <span class="crest">MU</span>
        <span>MUFC Chart Contest</span>
      </a>
      <nav class="nav-actions">
        <button class="ghost-button" data-route="home">首页</button>
        <button class="ghost-button" data-route="submit">提交作品</button>
        <button class="ghost-button hidden" id="profileNav" data-route="profile">个人中心</button>
        <button class="primary-button" id="authToggle" data-route="auth">登录</button>
      </nav>
    </header>

    <main>
      <section class="hero">
        <div class="hero-copy">
          <p class="eyebrow">Multi-University Fanmade Contest</p>
          <h1>高校舞萌 DX 谱面创作比赛作品墙</h1>
          <p>
            面向高校在校生与毕业生的 fanmade 谱面创作活动。受邀用户可以提交一张谱面展示图，登录后可进入详情页评分，首页展示作品、均分与评分数量。
          </p>
          <div class="hero-actions">
            <button class="primary-button" data-route="submit">提交谱面</button>
            <button class="secondary-button" data-route="home">浏览作品</button>
          </div>
        </div>
      </section>

      <section class="workspace">
        <section class="content-view" id="homeView">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Gallery</p>
              <h2>参赛作品</h2>
            </div>
            <button class="secondary-button" id="refreshGallery" type="button">刷新</button>
          </div>
          <div class="gallery-grid" id="galleryGrid"></div>
        </section>

        <section class="content-view hidden" id="submitView">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Submission</p>
              <h2>提交图片</h2>
            </div>
          </div>
          <form id="submissionForm" class="submit-form">
            <label>
              标题
              <input name="title" maxlength="80" required placeholder="例如：宴星回廊 Master" />
            </label>
            <label>
              说明
              <textarea name="description" maxlength="500" rows="5" placeholder="写一点作品背景"></textarea>
            </label>
            <label>
              maidata.txt
              <input name="maidata" type="file" accept=".txt,text/plain" required />
            </label>
            <label>
              track.mp3
              <input name="track" type="file" accept="audio/mpeg,.mp3" required />
            </label>
            <label>
              bg.jpg / bg.png
              <input name="bg" type="file" accept="image/jpeg,image/png,.jpg,.jpeg,.png" required />
            </label>
            <label>
              pv.mp4（可选）
              <input name="pv" type="file" accept="video/mp4,.mp4" />
            </label>
            <button class="primary-button" type="submit">提交到作品墙</button>
          </form>
          <p class="notice" id="submitNotice"></p>
        </section>

        <section class="content-view auth-view hidden" id="authView">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Account</p>
              <h2>用户入口</h2>
            </div>
            <p class="session-chip" id="sessionLabel">未登录</p>
          </div>

          <div class="auth-layout">
            <form id="loginForm" class="stack auth-card">
              <h3>登录</h3>
              <label>
                邮箱
                <input name="email" type="email" autocomplete="email" required />
              </label>
              <label>
                密码
                <input name="password" type="password" autocomplete="current-password" minlength="6" required />
              </label>
              <button class="primary-button" type="submit">登录</button>
            </form>

            <form id="registerForm" class="stack auth-card hidden">
              <h3>邀请码注册</h3>
              <label>
                昵称
                <input name="displayName" autocomplete="nickname" required />
              </label>
              <label>
                邮箱
                <input name="email" type="email" autocomplete="email" required />
              </label>
              <label>
                密码
                <input name="password" type="password" autocomplete="new-password" minlength="6" required />
              </label>
              <label>
                邀请码
                <input name="inviteCode" autocomplete="off" required />
              </label>
              <button class="primary-button" type="submit">注册</button>
            </form>
          </div>

          <button class="link-button" id="switchAuth" type="button">需要邀请码注册？</button>
          <p class="notice" id="authNotice"></p>
        </section>

        <section class="content-view hidden" id="profileView">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Profile</p>
              <h2>个人中心</h2>
            </div>
            <button class="secondary-button" id="refreshProfile" type="button">刷新</button>
          </div>

          <div class="profile-grid">
            <section class="profile-panel">
              <div class="panel-heading compact-heading">
                <h3>我的作品</h3>
                <span class="score-pill" id="mySubmissionCount">0</span>
              </div>
              <div class="profile-list" id="mySubmissionsList"></div>
            </section>

            <section class="profile-panel">
              <div class="panel-heading compact-heading">
                <h3>我的评分</h3>
                <span class="score-pill" id="myRatingCount">0</span>
              </div>
              <div class="profile-list" id="myRatingsList"></div>
            </section>
          </div>

          <p class="notice" id="profileNotice"></p>
        </section>

        <section class="content-view hidden" id="detailView">
          <button class="link-button" data-route="home" type="button">返回首页</button>
          <div class="preview-shell hidden" id="previewShell">
            <iframe id="majdataFrame" title="Majdata chart preview" allow="autoplay; fullscreen"></iframe>
          </div>
          <article class="detail" id="detailContent"></article>
        </section>
      </section>
    </main>

    <template id="submissionCardTemplate">
      <article class="submission-card">
        <button class="image-button" type="button">
          <img alt="" />
        </button>
        <div class="card-body">
          <h3></h3>
          <p></p>
          <div class="score-row">
            <span class="score-pill"></span>
            <button class="secondary-button" type="button">评分</button>
          </div>
        </div>
      </article>
    </template>

    <script src="app.js?v=20260530-chartpack"></script>
  </body>
</html>
